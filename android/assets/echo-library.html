<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#101215;color:#eef3f1;font:20px sans-serif}button,input,select{font:inherit;color:inherit;background:#20272a;border:0;border-radius:12px;min-height:48px;padding:10px 14px}button:active{background:#35554b}button:disabled{opacity:.4}.layout{height:100vh;display:grid;grid-template-columns:125px 1fr 230px;grid-template-rows:minmax(0,1fr);gap:14px;padding:12px}nav{min-height:0;display:flex;flex-direction:column;gap:8px}nav button{text-align:left;font-size:19px}nav .active{background:#284d40;color:#b5efdb}main{min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px}.search{display:flex;gap:8px}.search input{min-width:0;width:100%}#list{min-height:0;overflow:auto;flex:1}.row{width:100%;display:flex;flex-direction:column;text-align:left;margin-bottom:8px;min-height:68px;background:#1b2124}.row small{font-size:15px;color:#a7b4b0;margin-top:5px}.right{display:flex;flex-direction:column;gap:12px;border-left:1px solid #2c3536;padding-left:14px}.label{font-size:14px;color:#9aaea6;text-transform:uppercase;letter-spacing:1px}select{width:100%;font-size:17px}#song{font-size:23px;line-height:1.3;margin-top:12px}#artist{font-size:17px;color:#a7b4b0}.controls{display:flex;gap:6px}.controls button{flex:1;padding:6px;font-size:24px}.primary{background:#b5efdb;color:#10231b}#status{font-size:15px;line-height:1.4;color:#b7c8c1;overflow-wrap:anywhere}.foot{display:flex;justify-content:space-between;align-items:center;font-size:16px}.full{margin-top:auto;font-size:16px}#login{position:fixed;inset:0;background:#101215;display:none;padding:40px;z-index:3}#login p{line-height:1.5;max-width:650px}

body{background:#101416;font-size:18px}.layout{grid-template-columns:106px minmax(0,1fr) 224px;gap:18px;padding:14px 18px}nav{gap:4px;padding-top:2px}nav button{font-size:16px;background:transparent;color:#96a5a1;border-radius:9px;padding:10px 12px;text-align:left}nav .active{background:#213b33;color:#a9e4cf}nav .full{font-size:14px;color:#b0c3bb;border:1px solid #2c3935}button,input,select{border-radius:10px;min-height:44px}.search input{font-size:18px;background:#1b2427;border:1px solid #2b383a}.search button{font-size:16px;background:#283f37;color:#c8ebdc}.row{background:transparent;border-radius:10px;min-height:68px;padding:8px;display:flex;flex-direction:row;align-items:center;gap:12px;margin:0;border-bottom:1px solid #202c2e}.row:active{background:#243d34}.row .copy{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}.row .title{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{font-size:14px;color:#92a6a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}.thumb{width:50px;height:50px;flex:none;object-fit:cover;border-radius:7px;background:#253531}.row .playmark{font-size:18px;color:#77968a}.right{gap:8px;border-left:1px solid #283432;padding-left:18px}.label{font-size:12px;letter-spacing:1.5px}select{font-size:15px;background:#1c2827;min-height:42px;padding:8px;width:100%}.art{height:122px;width:122px;align-self:center;flex:none;border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#30493e,#1c282b);margin:2px 0;box-shadow:0 8px 24px #0004;display:grid;place-items:center;color:#b2ccbe;font-size:36px}.art img{width:100%;height:100%;object-fit:cover;grid-area:1/1}.art span{grid-area:1/1}#song{font-size:19px;margin:0;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#artist{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls button{min-height:44px;font-size:24px;background:transparent}.controls .primary{background:#b9e9d6;color:#153428}#status{font-size:12px;color:#91aaa0;line-height:1.3;max-height:32px;overflow:hidden}.right>.label:last-child{display:none}.foot button{background:transparent;color:#a5bdb3;font-size:14px;min-height:36px}.foot{font-size:14px;color:#7f9b8e}.search{flex:none}#list{scrollbar-width:thin}

.right{min-height:0;gap:5px}.right>.label{font-size:11px;flex:none}select{min-height:34px;height:34px;padding:5px 8px}.art{flex:1 1 72px;min-height:44px;max-height:80px;height:auto;width:80px;margin:0;box-shadow:0 4px 14px #0004}.art img{height:100%;min-height:0}#song{flex:none;font-size:18px;line-height:21px;max-height:42px}#artist{flex:none;font-size:13px;min-height:16px}.controls{flex:none}.controls button{min-height:36px;height:36px;font-size:22px}#status{flex:none;font-size:11px;min-height:14px;max-height:28px;line-height:14px}.vol{display:flex;align-items:center;gap:5px;flex:none;min-height:36px}.vol button{background:transparent;min-height:36px;height:36px;width:30px;padding:0;font-size:23px}.vol input{padding:0;min-height:32px;width:0;flex:1;accent-color:#b9e9d6;background:transparent}.vol output{font-size:12px;min-width:29px;text-align:right;color:#b5cbc0}
</style></head><body><div class="layout"><nav><button data-view="tracks" class="active">Songs</button><button data-view="favorites">Favorites</button><button data-view="playlists">Playlists</button><button data-view="albums">Albums</button><button class="full" id="full">Full MA ↗</button></nav><main><form class="search" id="search"><input id="query" placeholder="Search music" autocomplete="off"><button>Find</button></form><div id="list"></div><div class="foot"><button id="back">Previous</button><span id="page">1</span><button id="more">Next</button></div></main><aside class="right"><div class="label">Play on</div><select id="players"><option value="">Choose a player</option></select><div class="art"><span>♪</span><img id="cover" alt="" hidden></div><div id="song">Ready for music</div><div id="artist"></div><div class="controls"><button id="prev">‹</button><button id="toggle" class="primary">▶</button><button id="next">›</button></div><div class="vol"><button id="vdown" aria-label="Lower volume">−</button><input id="volume" aria-label="Volume" type="range" min="0" max="100" step="1"><button id="vup" aria-label="Raise volume">+</button><output id="level">—</output></div><div id="status">Connecting…</div><div class="label">Select a destination before playing</div></aside></div><div id="login"><h2>Connect Music Assistant</h2><p>Sign in using Full MA, then return to Library. Your existing MA account is used for this screen.</p><button id="sign">Open Full MA</button><button onclick="location.reload()">Try again</button></div><script>
const $=id=>document.getElementById(id);let view='tracks',offset=0,items=[],players=[],busy=false,search='';let volumeEditing=false,volumeSending=false,desiredVolume=null,volumeHoldUntil=0;let chosen=localStorage.getItem('echo_touch_player')||'';
function status(s){$('status').textContent=s}function full(){location.href=new URL('/__echo_full_ma',location.href).href}$('full').onclick=$('sign').onclick=full;
async function api(command,args={}){const token=localStorage.getItem('ma_access_token');if(!token){$('login').style.display='block';throw Error('Sign in with Full MA first')}const r=await fetch(new URL('/api',location.href),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({message_id:String(Date.now()),command,args})});if(r.status===401||r.status===403){if(r.status===401)$('login').style.display='block';throw Error('MA authentication or permission denied')}if(!r.ok)throw Error('MA request failed ('+r.status+')');let d=await r.json();if(d===null)return null;if(d.error||d.error_code)throw Error(d.details||d.error||'MA command failed');return d.result===undefined?d:d.result}
function array(d){return Array.isArray(d)?d:(d.items||[])}function subtitle(x){return (x.artists||[]).map(a=>a.name).join(', ')||x.owner||x.media_type||''}
function artUrl(x,size=128){
 if(!x)return '';if(x.image_url)return x.image_url;if(typeof x.image==='string')return x.image;
 const images=x.metadata?.images||x.album?.metadata?.images||[];const im=(typeof x.image==='object'?x.image:null)||x.album?.image||images.find(i=>i.type==='thumb')||images[0]||x.artists?.find(a=>a.image)?.image;if(!im)return '';
 if(im.proxy_id)return new URL('/imageproxy/'+encodeURIComponent(im.proxy_id)+'?size='+size,location.href).href;
 if(!im.path)return '';return new URL('/imageproxy?path='+encodeURIComponent(encodeURIComponent(im.path))+'&provider='+encodeURIComponent(im.provider||'builtin')+'&size='+size,location.href).href;
}
function image(el,url){if(el.dataset.url===url)return;el.dataset.url=url||'';el.hidden=!url;el.onerror=()=>{el.hidden=true};if(url)el.src=url;else el.removeAttribute('src')}
function render(){const box=$('list');box.replaceChildren();if(!items.length){box.textContent='No music found';return}for(const x of items){const b=document.createElement('button');b.className='row';const img=document.createElement('img');img.className='thumb';img.alt='';img.loading='lazy';image(img,artUrl(x));const copy=document.createElement('span');copy.className='copy';const title=document.createElement('span');title.className='title';title.textContent=x.name||'Untitled';const sub=document.createElement('small');sub.textContent=subtitle(x);copy.append(title,sub);const mark=document.createElement('span');mark.className='playmark';mark.textContent='›';b.append(img,copy,mark);b.onclick=()=>play(x);box.append(b)}$('page').textContent=String(offset/20+1);$('back').disabled=offset===0;$('more').disabled=!!search||items.length<20}
async function browse(){if(busy)return;busy=true;status('Loading…');try{if(search){const d=await api('music/search',{search_query:search,media_types:['track','album','playlist'],limit:20});items=[...(d.tracks||[]),...(d.albums||[]),...(d.playlists||[])]}else{const type=view==='favorites'?'tracks':view;items=array(await api('music/'+type+'/library_items',{limit:20,offset,summary:false,favorite:view==='favorites'?true:null}));}render();status('Choose music to play')}catch(e){status(e.message)}finally{busy=false}}
async function refresh(){try{players=array(await api('players/all',{return_unavailable:false,return_disabled:false,return_protocol_players:false}));const old=$('players').value||chosen;const options=[new Option('Choose a player','')];for(const p of players){if(p.type==='protocol')continue;options.push(new Option(p.display_name||p.name||p.player_id,p.player_id))}if(Array.from($('players').options).map(o=>o.value+'|'+o.text).join('~')!==options.map(o=>o.value+'|'+o.text).join('~'))$('players').replaceChildren(...options);if(players.some(p=>p.player_id===old))$('players').value=old;const p=players.find(p=>p.player_id===$('players').value);if(p){if(!volumeEditing&&!volumeSending&&Date.now()>volumeHoldUntil){const level=(p.group_members?.length||p.static_group_members?.length)?(p.group_volume??p.volume_level):p.volume_level;if(Number.isFinite(level)){$('volume').value=level;$('level').textContent=Math.round(level)+'%'}}const m=p.current_media||{};image($('cover'),artUrl(m,256));$('song').textContent=m.title||m.name||'Ready for music';$('artist').textContent=m.artist||'';$('toggle').textContent=p.playback_state==='playing'?'Ⅱ':'▶'}}catch(e){status(e.message)}}
function target(){const p=$('players').value;if(!p)throw Error('Choose a player first');return p}
async function play(x){try{const queue_id=target();status('Starting…');await api('player_queues/play_media',{queue_id,media:x.uri||x,option:'replace'});status('Playback requested');await refresh()}catch(e){status(e.message)}}
async function control(action){try{await api('player_queues/'+action,{queue_id:target()});await refresh()}catch(e){status(e.message)}}

async function setVolume(value){
 let player_id;try{player_id=target()}catch(e){status(e.message);volumeEditing=false;return}
 desiredVolume={player_id,level:Math.max(0,Math.min(100,Math.round(value)))};
 $('volume').value=desiredVolume.level;$('level').textContent=desiredVolume.level+'%';
 if(volumeSending)return;volumeSending=true;
 try{while(desiredVolume){const request=desiredVolume;desiredVolume=null;const p=players.find(p=>p.player_id===request.player_id);let members=[...new Set([...(p?.group_members||[]),...(p?.static_group_members||[])])].filter(id=>id!==request.player_id);if(!members.length)members=[request.player_id];
 status(members.length>1?'Matching speaker volumes…':'Setting volume…');
 for(const id of members)await api('players/cmd/volume_set',{player_id:id,volume_level:request.level});
 let matched=false;for(let i=0;i<4;i++){await new Promise(r=>setTimeout(r,350));const states=array(await api('players/all',{return_unavailable:false,return_disabled:false,return_protocol_players:false}));players=states;matched=members.every(id=>{const state=states.find(p=>p.player_id===id);return state&&Math.abs((state.volume_level??-100)-request.level)<=1});if(matched||desiredVolume)break}
 volumeHoldUntil=Date.now()+700;status(matched?'All speakers '+request.level+'%':'Volume sent; speaker values have not settled');
 }}catch(e){status(e.message)}finally{volumeSending=false;volumeEditing=false;await refresh()}
}
$('volume').onpointerdown=()=>volumeEditing=true;$('volume').oninput=()=>{volumeEditing=true;$('level').textContent=$('volume').value+'%'};$('volume').onchange=()=>setVolume(Number($('volume').value));$('volume').onpointercancel=()=>volumeEditing=false;$('vdown').onclick=()=>setVolume(Number($('volume').value)-5);$('vup').onclick=()=>setVolume(Number($('volume').value)+5);
$('players').onchange=()=>{chosen=$('players').value;localStorage.setItem('echo_touch_player',chosen);refresh()};$('toggle').onclick=()=>control('play_pause');$('prev').onclick=()=>control('previous');$('next').onclick=()=>control('next');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;offset=0;search='';$('query').value='';document.querySelectorAll('[data-view]').forEach(v=>v.classList.toggle('active',v===b));browse()});$('search').onsubmit=e=>{e.preventDefault();search=$('query').value.trim();offset=0;browse()};$('back').onclick=()=>{offset=Math.max(0,offset-20);browse()};$('more').onclick=()=>{offset+=20;browse()};refresh();browse();setInterval(refresh,4000);
</script></body></html>
